[package]
name = "arthur"
version = "0.1.0"
description = "A.R.T.H.U.R. product application (Tauri v2 shell)"
edition = "2021"

[lib]
# `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# staticlib + cdylib are required for the Android/iOS builds.
name = "arthur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
