[package]
name = "arthur"
version = "0.1.0"
description = "A.R.T.H.U.R. product application (Tauri v2 shell)"
edition = "2021"
rust-version = "1.89"

[lib]
# `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# staticlib + cdylib are required for the Android/iOS builds.
name = "arthur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
serde_json = "1"
serde_jcs = "=0.1.0"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
zeroize = "=1.9.0"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
ring = "=0.17.14"
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = "=0.21.1"

[features]
# Explicit debug instrumentation harness; rejected in release builds.
android-identity-tests = []

[dev-dependencies]
tempfile = "3.27.0"
