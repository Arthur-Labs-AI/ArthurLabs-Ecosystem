<rect x="856.35" y="101.55" width="98.6" height="116.44999999999999" fill="#23889d" fill-opacity="1" stroke="#8ee8fa" stroke-width="1.3" stroke-dasharray=""/>
<text x="880.6500000000001" y="241.8" fill="#edf5ff" font-size="12" font-family="sans-serif">J5001</text>
<text x="162" y="473" fill="#edf5ff" font-size="17" font-family="sans-serif">INNER ELECTRODE STRAP: route north; detailed path pending</text>
<text x="162" y="507" fill="#edf5ff" font-size="17" font-family="sans-serif">OUTER TIGHTENING STRAP: separate shell/lug load path</text>
<text x="162" y="575" fill="#edf5ff" font-size="15" font-family="sans-serif">No final enclosure, lugs, clamp or battery geometry is assumed.</text>
<text x="162" y="609" fill="#edf5ff" font-size="15" font-family="sans-serif">Source board outline and component locations are unchanged.</text>
<text x="162" y="1187" fill="#edf5ff" font-size="14" font-family="sans-serif">USB south; J1 and U.FL east-side access must remain available.</text>
<text x="55" y="1325" fill="#edf5ff" font-size="19" font-family="sans-serif">Local reservations to carry into enclosure CAD (engineering starting values, not a fixed case size)</text>
<text x="55" y="1364" fill="#edf5ff" font-size="14" font-family="sans-serif">1. Header region: x=2.90..48.40, main body y=0.75..6.75, z up to 5.50 mm.</text>
<text x="55" y="1397" fill="#edf5ff" font-size="14" font-family="sans-serif">2. Seated plug region: x=3.95..47.35, y=-2.85..4.00; continuous path north of PCB.</text>
<text x="55" y="1430" fill="#edf5ff" font-size="14" font-family="sans-serif">3. Proposed service travel: clear y down to -9.85; open lid or a plug-sized service hatch.</text>
<text x="55" y="1463" fill="#edf5ff" font-size="14" font-family="sans-serif">4. Add 0.50 mm trial solid clearance: header ceiling &gt;=6.00; seated north wall &lt;=-3.35.</text>
<text x="55" y="1496" fill="#edf5ff" font-size="14" font-family="sans-serif">5. Cable-only holes may be smaller than a plug, but then assembly/service must occur with the lid open.</text>
<text x="55" y="1529" fill="#edf5ff" font-size="14" font-family="sans-serif">6. Keep five channels identified; J5001 uses one electrode conductor, and its NC terminal stays isolated.</text>
<text x="55" y="1562" fill="#edf5ff" font-size="14" font-family="sans-serif">7. Shell-mounted strain relief intercepts strap/cable tension before it reaches the connector solder tabs.</text>
<text x="55" y="1595" fill="#edf5ff" font-size="14" font-family="sans-serif">8. No fastener, lug or clip positions are approved by these reservation zones.</text>
<text x="55" y="1662" fill="#edf5ff" font-size="14" font-family="sans-serif">Dimension history: earlier target 61 x 52 -&gt; V1 51.30 x 62.45 -&gt; routing V1C 51.30 x 64.95 -&gt; ECO unchanged.</text>
<text x="55" y="1710" fill="#ffbf79" font-size="17" font-family="sans-serif">NOT RELEASED | final enclosure integration is a separate mechanical design task</text>
</svg>
