<text x="730" y="548" class="small">Gold: fixed PCB lands. Dashed: body in hypothesized CPL pose.</text>
<text x="730" y="573" class="small">Signal tails must land south; retention tabs must land north.</text>
<text x="730" y="598" class="small">Pin 1 EAST; pin 2 WEST. A 180° turn also swaps pin sides.</text>
<text x="730" y="623" class="small" style="fill:#13765d">Accept only after matching actual JLC 2D + 3D overlays.</text>
<text x="40" y="675" class="sub">Required board coordinates (mm): signal centers Y=8.00; retention centers Y=2.25; entry face Y=0.75.</text>
<text x="40" y="704" class="small">Origins west → east: J401 (6.85,5.15), J301 (16.25,5.15), J201 (25.65,5.15), J101 (35.05,5.15), J5001 (44.45,5.15).</text>
<text x="40" y="733" class="small">Signal pin 1 = origin X+1; pin 2 = origin X−1. Retention pads = origin X±3.35. Body width 7.90; height 5.50 mm.</text>
<text x="40" y="765" class="sub" style="fill:#a62f28">J1 remains CPL 270° but is ON HOLD: public 2D suggests 90°. Its opening must face EAST, pin 1 must land on VBAT.</text>
<text x="40" y="795" class="small">NOT RELEASED — diagram is derived geometry, not a manufacturer CAD model or JLCPCB assembly screenshot.</text>
